# ==============================================================================
# INFOSOF TECHNOLOGIES - Pharmacy Management Software
# Render Blueprint Specification (render.yaml)
# ==============================================================================

services:
  - type: web
    name: infosof-pharmacy
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: "INFOSOF Pharmacy Management"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: mysql
      - key: SESSION_LIFETIME
        value: "7200"
      # TiDB Cloud Connection:
      # Set DATABASE_URL or TIDB_HOST in your Render Dashboard -> Environment
      # - key: DATABASE_URL
      #   value: "mysql://<user>:<password>@<host>:4000/<dbname>?sslmode=verify-full"
      # Or configure individual TiDB keys:
      # - key: TIDB_HOST
      #   value: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
      # - key: TIDB_PORT
      #   value: "4000"
      # - key: TIDB_USER
      #   value: "your_user.root"
      # - key: TIDB_PASSWORD
      #   sync: false
      # - key: TIDB_DATABASE
      #   value: "pharmacy_db"
